name: Build and deploy game to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Obtener el código
        uses: actions/checkout@v6

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Empaquetar el juego
        run: npm run build

      - name: Subir el paquete de Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      - name: Publicar juego
        id: deployment
        uses: actions/deploy-pages@v4
